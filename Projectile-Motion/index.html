<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projectile Motion Simulator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>
  <main>
    <h1>Projectile Motion Simulator</h1>
    <div class="controls">
      <div class="field">
        <label for="velocity">Initial velocity (m/s)</label>
        <input type="number" id="velocity" value="50">
      </div>
      <div class="field">
        <label for="angle">Launch angle (degrees)</label>
        <input type="number" id="angle" value="45">
      </div>
      <div class="buttons">
        <button id="start-btn" onclick="startSimulation()">Start</button>
        <button id="reset-btn" onclick="resetSimulation()">Reset</button>
      </div>
    </div>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
